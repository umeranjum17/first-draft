name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Docs-only changes skip the heavy steps below. Any path this does not recognise counts as code, so the gate stays closed by default.
      - id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; running the full gate." >&2
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              LICENSE|NOTICE) ;;
              docs/wrapper-allowlist.json|docs/logo-512.png) code=true ;;
              docs/*) ;;
              *.md) case "$f" in */*) code=true ;; esac ;;
              *) code=true ;;
            esac
          done <<< "$(git diff --name-only "$base" "$HEAD_SHA" --)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The hero-video step encodes its loop with ffmpeg, and the asset journey uses the real binary.
      - if: needs.changes.outputs.code == 'true'
        run: command -v convert && command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg)
      - run: node scripts/check-samples.mjs
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true'
        run: npm test
