name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Docs-only changes skip the heavy steps below. Any path this does not recognise counts as code, so the gate stays closed by default.
      - id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; running the full gate." >&2
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              LICENSE|NOTICE) ;;
              docs/wrapper-allowlist.json|docs/logo-512.png) code=true ;;
              docs/*|evidence/*|screenshots/*|**/evidence/*|**/screenshots/*) ;;
              *.md)
                case "$f" in
                  .github/workflows/*|*/manifest.md|manifest.md) code=true ;;
                  *) ;;
                esac
                ;;
              *) code=true ;;
            esac
          done <<< "$(git diff --name-only "$base" "$HEAD_SHA" --)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  test:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The hero-video step encodes its loop with ffmpeg, and the asset journey uses the real binary.
      - if: needs.changes.outputs.code == 'true'
        run: command -v convert && command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg)
      - run: node scripts/check-samples.mjs
      - if: needs.changes.outputs.code == 'true'
        run: npm ci
      - if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: npm test

  main-package-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install and smoke-test packed CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/home" "$RUNNER_TEMP/xdg-config" "$RUNNER_TEMP/xdg-data" "$RUNNER_TEMP/xdg-state" "$RUNNER_TEMP/tmp" "$RUNNER_TEMP/fd-home"
          npm install --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/first-draft-axi-*.tgz
          cli="$RUNNER_TEMP/prefix/node_modules/first-draft-axi/src/cli.mjs"
          node_bin="$(command -v node)"
          clean=(env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config" XDG_DATA_HOME="$RUNNER_TEMP/xdg-data" XDG_STATE_HOME="$RUNNER_TEMP/xdg-state" TMPDIR="$RUNNER_TEMP/tmp" FIRST_DRAFT_HOME="$RUNNER_TEMP/fd-home" npm_config_userconfig=/dev/null)
          if "${clean[@]}" "$node_bin" "$cli" doctor >"$RUNNER_TEMP/doctor.log" 2>&1; then
            echo 'doctor unexpectedly found an engine in the isolated environment' >&2
            exit 1
          fi
          grep -Eqi 'sign.?in|engine|configured' "$RUNNER_TEMP/doctor.log"
          if "${clean[@]}" "$node_bin" "$cli" make 'CI refusal smoke' --out "$RUNNER_TEMP/refused.html" >"$RUNNER_TEMP/refusal.log" 2>&1; then
            echo 'make unexpectedly succeeded without an engine' >&2
            exit 1
          fi
          grep -Eqi 'sign.?in|engine|configured' "$RUNNER_TEMP/refusal.log"
          printf '<!doctype html><p>CI fixture</p>\n' > "$RUNNER_TEMP/fixture.html"
          printf '{"figures":[],"states":[]}\n' > "$RUNNER_TEMP/fixture.json"
          "${clean[@]}" "$node_bin" "$cli" check "$RUNNER_TEMP/fixture.html" --data "$RUNNER_TEMP/fixture.json"
