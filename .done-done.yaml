# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "first-draft"
journeys:
  assets-higgsfield:
    command: node journeys/assets.mjs higgsfield
    spends: one Z Image plus design-model turns; previews credits first
    timeout: 30m
  assets-codex:
    command: node journeys/assets.mjs codex
    spends: one native Codex image plus design-model turns; subscription quota and overage unknown
    timeout: 30m
  render-check:
    command: bash journeys/render-check.sh
    timeout: 40m
  studio:
    command: node journeys/studio.mjs
    timeout: 10m

# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
