# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "first-draft"
journeys:
  redesign:
    command: node journeys/redesign.mjs
    timeout: 10m
  references:
    command: node journeys/references.mjs
    timeout: 10m
  cli-controls-recapture:
    command: node journeys/cli-controls-capture.mjs
    timeout: 5m
  cli-controls:
    command: node journeys/cli-controls.mjs
    core: true
    timeout: 120m
  assets-recapture:
    command: node journeys/assets.mjs --capture-only
    timeout: 10m
  onboarding-flow:
    command: node journeys/onboarding-flow.mjs
    spends: one character style sheet and one scene per screen through the owner's Codex subscription (no credits), plus design-model turns; previews the image budget first
    timeout: 60m
  onboarding-flow-capture:
    command: node journeys/onboarding-flow.mjs --capture-only
    timeout: 15m
  assets:
    # mise exec: the installed codex, higgsfield and magick are mise shims that need a node runtime first.
    command: mise exec node@26.1.0 -- node journeys/assets.mjs
    spends: up to three stills the design agent chooses on Codex (subscription quota, no credits) plus one Higgsfield hero loop (Seedance 2.0 Mini, 5 credits at this account's estimate) and design-model turns; previews cost first
    timeout: 40m
  render-check:
    command: bash journeys/render-check.sh
    timeout: 40m
  studio:
    command: node journeys/studio.mjs
    timeout: 25m
  logo-recapture:
    command: node journeys/logo.mjs
    timeout: 25m
  readme:
    command: node journeys/readme.mjs
    timeout: 8m
  landing:
    command: node journeys/landing.mjs
    timeout: 5m
  version:
    command: node journeys/version.mjs
    timeout: 8m
  clarity-recapture:
    command: node journeys/clarity.mjs
    timeout: 8m
  critic:
    command: node journeys/critic.mjs
    timeout: 8m
  human-side-recapture:
    command: node journeys/human-side.mjs
    timeout: 8m
  motion:
    command: node journeys/motion.mjs
    timeout: 15m
  click:
    command: node journeys/click.mjs
    timeout: 15m

# Written requirements for the motion journey: an option's own animation, captured as frames (no mock: it is a new capture, not a new screen).
approved_requirements:
  - kind: spec
    name: motion frame at 390, first
    requirement: "A narrow page with the heading 'Notes, version 1, draw 1' and a grey terminal block that holds only one partly typed command line beginning with '$ npm'."
    capture: motion-390-1.jpg
    journey: motion
  - kind: spec
    name: motion frame at 390, last
    requirement: "A narrow page with the heading 'Notes, version 1, draw 1' whose grey terminal block holds three lines: '$ npm install -g first-draft-axi', 'added 1 package in 2s' and '$ first-draft-axi make \"a notes app\"'."
    capture: motion-390-4.jpg
    journey: motion
  - kind: spec
    name: motion frame at 1280, last
    requirement: "A wide page with the heading 'Notes, version 1, draw 1' whose grey terminal block holds the same three lines, with an underscore cursor below the block."
    capture: motion-1280-4.jpg
    journey: motion
